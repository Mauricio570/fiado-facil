<div class="casca" [class.menu-expandido]="menuExpandido()">
  <aside class="barra-lateral">
    <div class="marca">
      <span class="marca-icone" aria-hidden="true">
        <svg class="icone" viewBox="0 0 24 24">
          <path d="M5 4.5h11.5A2.5 2.5 0 0 1 19 7v12.5H7.5A2.5 2.5 0 0 1 5 17V4.5Z" />
          <path d="M5 17a2.5 2.5 0 0 1 2.5-2.5H19" />
        </svg>
      </span>
      <span class="marca-nome">SafeBook</span>
    </div>

    <nav class="navegacao" aria-label="Menu principal">
      <a class="item-navegacao" routerLink="/home" routerLinkActive="ativo">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V10Z" />
          <path d="M9 21v-7h6v7" />
        </svg>
        <span class="rotulo">Home</span>
      </a>
      <a class="item-navegacao" routerLink="/clientes" routerLinkActive="ativo">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="9" cy="8" r="3" />
          <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5.5a3 3 0 0 1 0 5M18 14c1.8.6 3 2.3 3 4.3" />
        </svg>
        <span class="rotulo">Clientes</span>
      </a>
      <span class="item-navegacao desabilitado" aria-disabled="true">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="5" y="4" width="14" height="17" rx="1" />
          <path d="M9 4.5h6M9 10h6M9 14h6M9 18h3" />
        </svg>
        <span class="rotulo">Relatórios</span>
      </span>
      <a class="item-navegacao" routerLink="/personalizacao" routerLinkActive="ativo">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z" />
        </svg>
        <span class="rotulo">Personalização</span>
      </a>
    </nav>

    <button class="item-navegacao botao-sair" type="button" (click)="sair()">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M10 17l5-5-5-5M15 12H3M13 4h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5" />
      </svg>
      <span class="rotulo">Sair</span>
    </button>
  </aside>

  <button
    class="fundo-gaveta"
    type="button"
    tabindex="-1"
    aria-label="Fechar menu"
    (click)="fecharSeEstreita()"
  ></button>

  <div class="area-conteudo">
    <header class="barra-superior">
      <button class="botao-icone alternar-menu" type="button" (click)="alternarMenu()"
        [attr.aria-expanded]="menuExpandido()" aria-label="Recolher ou expandir o menu">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <path d="M10 4v16" />
        </svg>
      </button>

      <div class="conta">
        <span class="avatar-conta" aria-hidden="true">
          <svg class="icone" viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c.7-4 3.3-6 8-6s7.3 2 8 6" />
          </svg>
        </span>
        <span class="nome-conta">{{ usuario?.nomeEmpresa ?? 'Minha conta' }}</span>
      </div>
    </header>

    <main class="conteudo">
      <router-outlet />
    </main>
  </div>
</div>
